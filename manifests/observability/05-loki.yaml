apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: observability
data:
  loki.yml: |
    auth_enabled: false
    
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: warn
    
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    
    limits_config:
      retention_period: 168h
      ingestion_rate_mb: 8
      ingestion_burst_size_mb: 16
      max_query_series: 5000
      reject_old_samples: true
      reject_old_samples_max_age: 168h
    
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
    
    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules
      rule_path: /loki/rules-temp
      ring:
        kvstore:
          store: inmemory
      enable_api: true
    
    analytics:
      reporting_enabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: observability
  labels: { app: loki }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: loki }
  template:
    metadata:
      labels: { app: loki }
    spec:
      nodeSelector: { kubernetes.io/hostname: k8s-obs }
      securityContext: { fsGroup: 10001 }
      initContainers:
        - name: fix-perms
          image: docker.io/library/busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh","-c","mkdir -p /loki && chown -R 10001:10001 /loki"]
          securityContext: { runAsUser: 0 }
          volumeMounts:
            - { name: data, mountPath: /loki }
      containers:
        - name: loki
          image: docker.io/grafana/loki:3.3.2
          imagePullPolicy: IfNotPresent
          args: ["-config.file=/etc/loki/loki.yml"]
          ports:
            - { name: http, containerPort: 3100 }
            - { name: grpc, containerPort: 9096 }
          livenessProbe:
            httpGet: { path: /ready, port: 3100 }
            initialDelaySeconds: 45
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /ready, port: 3100 }
            initialDelaySeconds: 30
            timeoutSeconds: 5
          resources:
            requests: { cpu: 150m, memory: 512Mi }
            limits:   { cpu: "1",  memory: 1536Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data,   mountPath: /loki }
      volumes:
        - name: config
          configMap: { name: loki-config }
        - name: data
          hostPath: { path: /var/lib/aisre/loki, type: DirectoryOrCreate }
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: observability
  labels: { app: loki }
spec:
  selector: { app: loki }
  ports:
    - { name: http, port: 3100, targetPort: 3100 }
    - { name: grpc, port: 9096, targetPort: 9096 }