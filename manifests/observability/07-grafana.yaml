apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.observability.svc:9090
        isDefault: true
        jsonData:
          timeInterval: 15s
          httpMethod: POST
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.observability.svc:3100
        jsonData:
          maxLines: 1000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: observability
data:
  provider.yml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-env
  namespace: observability
data:
  GF_SECURITY_ADMIN_USER: "admin"
  GF_SECURITY_ADMIN_PASSWORD: "aisre-lab-admin"
  GF_USERS_ALLOW_SIGN_UP: "false"
  GF_ANALYTICS_REPORTING_ENABLED: "false"
  GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
  GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
  GF_NEWS_NEWS_FEED_ENABLED: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels: { app: grafana }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      nodeSelector: { kubernetes.io/hostname: k8s-obs }
      securityContext: { fsGroup: 472 }
      initContainers:
        - name: fix-perms
          image: docker.io/library/busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh","-c","mkdir -p /var/lib/grafana/dashboards && chown -R 472:472 /var/lib/grafana"]
          securityContext: { runAsUser: 0 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/grafana }
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:11.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - configMapRef: { name: grafana-env }
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 40
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 20
            timeoutSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 472
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: dashprov,    mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards,  mountPath: /var/lib/grafana/dashboards }
            - { name: data,        mountPath: /var/lib/grafana }
      volumes:
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: dashprov
          configMap: { name: grafana-dashboard-provider }
        - name: dashboards
          configMap: { name: grafana-dashboards }
        - name: data
          hostPath: { path: /var/lib/aisre/grafana, type: DirectoryOrCreate }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
  labels: { app: grafana }
spec:
  type: NodePort
  selector: { app: grafana }
  ports:
    - { name: http, port: 3000, targetPort: 3000, nodePort: 30030 }