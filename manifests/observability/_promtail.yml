server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /run/promtail/positions.yaml

clients:
  - url: http://loki.observability.svc:3100/loki/api/v1/push
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

scrape_configs:
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      # 丢弃已结束的 Pod
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Succeeded|Failed|Pending
        action: drop
      # 丢弃观测组件自身的日志，避免自噪音
      - source_labels: [__meta_kubernetes_namespace]
        regex: observability|kube-system|kube-flannel|chaos-mesh
        action: drop
      # 标准标签
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_container_name]
        target_label: container
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app
      - source_labels: [__meta_kubernetes_pod_uid]
        target_label: __path__
        replacement: /var/log/pods/*$1/*/*.log
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
    pipeline_stages:
      - cri: {}
      - match:
          selector: '{app=~".+"}'
          stages:
            - regex:
                expression: '(?i)(?P<level>ERROR|WARN|FATAL|PANIC|Exception|Timeout|OOMKilled)'
            - labels:
                level: