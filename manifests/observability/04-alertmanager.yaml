apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: observability
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    
    route:
      receiver: aisre-webhook
      group_by: ["alertname","namespace","service"]
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 4h
      routes:
        - match: { severity: critical }
          receiver: aisre-webhook
          group_wait: 5s
          repeat_interval: 1h
    
    receivers:
      - name: aisre-webhook
        webhook_configs:
          - url: http://aisre-ingest.aiops.svc:8080/webhook/alertmanager
            send_resolved: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: observability
  labels: { app: alertmanager }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: alertmanager }
  template:
    metadata:
      labels: { app: alertmanager }
    spec:
      nodeSelector: { kubernetes.io/hostname: k8s-obs }
      securityContext: { fsGroup: 65534 }
      initContainers:
        - name: fix-perms
          image: docker.io/library/busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh","-c","mkdir -p /alertmanager && chown -R 65534:65534 /alertmanager"]
          securityContext: { runAsUser: 0 }
          volumeMounts:
            - { name: data, mountPath: /alertmanager }
      containers:
        - name: alertmanager
          image: quay.io/prometheus/alertmanager:v0.28.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.listen-address=:9093
          ports:
            - { name: http, containerPort: 9093 }
          livenessProbe:
            httpGet: { path: /-/healthy, port: 9093 }
            initialDelaySeconds: 20
          readinessProbe:
            httpGet: { path: /-/ready, port: 9093 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits:   { cpu: 300m, memory: 384Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager }
            - { name: data,   mountPath: /alertmanager }
      volumes:
        - name: config
          configMap: { name: alertmanager-config }
        - name: data
          hostPath: { path: /var/lib/aisre/alertmanager, type: DirectoryOrCreate }
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: observability
  labels: { app: alertmanager }
spec:
  type: NodePort
  selector: { app: alertmanager }
  ports:
    - { name: http, port: 9093, targetPort: 9093, nodePort: 30093 }