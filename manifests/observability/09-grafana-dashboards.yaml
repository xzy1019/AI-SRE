# 09-grafana-dashboards.yaml —— 3 个按项目定制的 Grafana 仪表盘（ConfigMap 形式，随 Git 版本管理）
#
# 为什么用 ConfigMap 而不是在 UI 里点：
#   · 仪表盘是"项目资产"，应该跟代码一起 review、回滚、复现（UI 点的面板无法 code review）
#   · 配合 grafana-dashboard-provider（updateIntervalSeconds=30）改完 30 秒内自动生效
#
# 三个盘的分工：
#   overview    总览：集群/业务/AIOps 一屏看全（值班第一眼）
#   demo-sli    业务 SLI：QPS/错误率/延迟/下游失败/Pod 状态（定位"哪里慢/哪里错"）
#   aiops-chain 自愈链路：ingest/告警/审计/策略（验证"链路通不通、有没有动作"）
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: observability
  labels: { app: grafana, part-of: aisre-agent }
data:
  aisre-overview.json: |
