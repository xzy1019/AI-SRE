apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["nodes","nodes/proxy","services","endpoints","pods"]
    verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: promtail }
subjects:
  - { kind: ServiceAccount, name: promtail, namespace: observability }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: observability
data:
  promtail.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
      log_level: warn
    
    positions:
      filename: /run/promtail/positions.yaml
    
    clients:
      - url: http://loki.observability.svc:3100/loki/api/v1/push
        backoff_config:
          min_period: 500ms
          max_period: 5m
          max_retries: 10
    
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # 丢弃已结束的 Pod
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Succeeded|Failed|Pending
            action: drop
          # 丢弃观测组件自身的日志，避免自噪音
          - source_labels: [__meta_kubernetes_namespace]
            regex: observability|kube-system|kube-flannel|chaos-mesh
            action: drop
          # 标准标签
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_uid]
            target_label: __path__
            replacement: /var/log/pods/*$1/*/*.log
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
        pipeline_stages:
          - cri: {}
          - match:
              selector: '{app=~".+"}'
              stages:
                - regex:
                    expression: '(?i)(?P<level>ERROR|WARN|FATAL|PANIC|Exception|Timeout|OOMKilled)'
                - labels:
                    level:
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: observability
  labels: { app: promtail }
spec:
  selector:
    matchLabels: { app: promtail }
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1 }
  template:
    metadata:
      labels: { app: promtail }
    spec:
      serviceAccountName: promtail
      securityContext:
        # 容器日志文件权限为 0640 root:root，需加入 root 组才能读取
        supplementalGroups: [0]
      tolerations:
        - operator: Exists
      initContainers:
        - name: fix-perms
          image: docker.io/library/busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh","-c","mkdir -p /run/promtail && chown -R 65534:65534 /run/promtail"]
          securityContext: { runAsUser: 0 }
          volumeMounts:
            - { name: run, mountPath: /run/promtail }
      containers:
        - name: promtail
          image: docker.io/grafana/promtail:3.3.2
          imagePullPolicy: IfNotPresent
          args: ["-config.file=/etc/promtail/promtail.yml"]
          ports:
            - { name: http, containerPort: 9080 }
          env:
            - name: HOSTNAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          # liveness 只判断进程存活。/ready 在没有可采集目标时返回 500，
          # 若用 /ready 做 liveness，无业务负载的节点上 Pod 会被反复重启。
          livenessProbe:
            tcpSocket: { port: 9080 }
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            # /ready 在「没有可采集目标」时返回 500（Promtail 的设计如此），
            # 拿它当就绪探针会让无业务 Pod 的节点一直是 0/1，并连带触发 PodNotReady 误报。
            # 改用端口存活判断：进程在监听就说明采集器本身是健康的。
            tcpSocket: { port: 9080 }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits:   { cpu: 300m, memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 0
          volumeMounts:
            - { name: config,    mountPath: /etc/promtail }
            - { name: run,       mountPath: /run/promtail }
            - { name: varlogpods, mountPath: /var/log/pods, readOnly: true }
      volumes:
        - name: config
          configMap: { name: promtail-config }
        - name: run
          hostPath: { path: /run/promtail, type: DirectoryOrCreate }
        - name: varlogpods
          hostPath: { path: /var/log/pods }
