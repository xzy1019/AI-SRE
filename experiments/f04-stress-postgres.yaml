# F04 —— postgres CPU 压力 80%（数据层故障）
# 类型: StressChaos / cpu ｜ 根因: postgres-service ｜ 预期: payment 的 DB 探测变慢 → 级联到 order/frontend
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: f04-stress-postgres
  namespace: chaos-mesh
  labels: { experiment-id: F04, ground-truth: postgres-service }
spec:
  mode: one
  selector:
    namespaces: [demo-app]
    labelSelectors: { app: postgres }
  stressors:
    cpu: { workers: 2, load: 80 }
  # 【时长校准】告警侧是 5m 速率窗口 + for: 2m/3m；故障短于判定时长会**结构性抓不住**（矩阵 F03/F04/F05 实测，见 docs/09 §4）。
  #            本实验时长按 “≥ 6 分钟” 调整，确保规则有足够时间从 pending 走到 firing。
  duration: '360s'